[package]
name = "leaf"
version = "1.0.0"
description = "Leaf — 100% free, private-by-design, local-first document reader crafted by NasirPintu"
authors = ["NasirPintu <https://github.com/nasiropintu>"]
license = "MIT"
repository = "https://github.com/nasiropintu/leaf-reader"
edition = "2021"

[lib]
name = "leaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
notify = "6"
